name: COROS Feishu Report

on:
  schedule:
    # Daily trigger as a reliability fallback; we gate actual execution below.
    - cron: '0 1 * * *' # 北京时间 09:00 (UTC 01:00)
  workflow_dispatch:      # 支持手动触发

jobs:
  deliver-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: coros-mcp-server/package-lock.json

      - name: Install dependencies
        run: |
          cd coros-mcp-server
          npm install

      - name: Build project
        run: |
          cd coros-mcp-server
          npm run build

      - id: run-window
        name: Resolve schedule run window (Asia/Shanghai)
        run: |
          DOW=$(TZ=Asia/Shanghai date +%u) # 1..7 (Mon..Sun)
          NOW=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')
          echo "Heartbeat: event=${{ github.event_name }}, run_id=${{ github.run_id }}, now=${NOW}, dow=${DOW}"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=non-schedule event" >> "$GITHUB_OUTPUT"
          elif [ "$DOW" = "3" ] || [ "$DOW" = "7" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=schedule on Wed/Sun" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=schedule outside Wed/Sun" >> "$GITHUB_OUTPUT"
          fi

      - name: Heartbeat summary
        run: |
          echo "should_run=${{ steps.run-window.outputs.should_run }}"
          echo "reason=${{ steps.run-window.outputs.reason }}"

      # Cannot use secrets.* inside step-level `if:` (workflow parse fails). Derive booleans via env here.
      - id: coros-auth-plan
        name: COROS auth plan
        if: steps.run-window.outputs.should_run == 'true'
        env:
          COROS_ACCESS_TOKEN: ${{ secrets.COROS_ACCESS_TOKEN }}
        run: |
          if [ -n "${COROS_ACCESS_TOKEN:-}" ]; then
            echo "needs_playwright=false" >> "$GITHUB_OUTPUT"
            echo "COROS auth: COROS_ACCESS_TOKEN secret is set → skip Chromium and headless login"
          else
            echo "needs_playwright=true" >> "$GITHUB_OUTPUT"
            echo "COROS auth: COROS_ACCESS_TOKEN not set → install Chromium and run headless login"
          fi

      - name: Install Playwright Browsers
        if: steps.run-window.outputs.should_run == 'true' && steps.coros-auth-plan.outputs.needs_playwright == 'true'
        run: |
          cd coros-mcp-server
          # Pin to the same major line as package.json `playwright-core` (mismatched CLI = missing browser path)
          npx --yes playwright@1.59.1 install chromium --with-deps

      - name: COROS Headless Login
        if: steps.run-window.outputs.should_run == 'true' && steps.coros-auth-plan.outputs.needs_playwright == 'true'
        timeout-minutes: 2
        run: |
          cd coros-mcp-server
          # 使用 --headless 登录并将 session 保存到默认路径
          node dist/cli.js auth login --headless
        env:
          COROS_ACCOUNT: ${{ secrets.COROS_ACCOUNT }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}

      - name: Upload Login Debug Screenshot
        if: steps.run-window.outputs.should_run == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug-screenshot
          path: coros-mcp-server/login-timeout-debug.png
          if-no-files-found: ignore

      - name: Generate and Deliver Report
        if: steps.run-window.outputs.should_run == 'true'
        run: |
          cd coros-mcp-server
          node scripts/deliver-feishu-report.mjs
        env:
          COROS_ACCESS_TOKEN: ${{ secrets.COROS_ACCESS_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL || 'tongyi-xiaomi-analysis-pro' }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_RECEIVE_ID_TYPE || 'open_id' }}

      - name: Notify Failure
        if: steps.run-window.outputs.should_run == 'true' && failure()
        run: |
          cd coros-mcp-server
          # 简单的失败通知逻辑可以写在这里，或者调用一个专门的脚本
          # 借用 curl 发送一个简单的飞书通知
          TOKEN=$(curl -s -X POST "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal" \
            -H "Content-Type: application/json" \
            -d "{\"app_id\":\"${{ secrets.FEISHU_APP_ID }}\",\"app_secret\":\"${{ secrets.FEISHU_APP_SECRET }}\"}" | jq -r .tenant_access_token)
          
          curl -X POST "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=${{ secrets.FEISHU_RECEIVE_ID_TYPE || 'open_id' }}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"receive_id\":\"${{ secrets.FEISHU_RECEIVE_ID }}\",\"msg_type\":\"text\",\"content\":\"{\\\"text\\\":\\\"❌ COROS 周报推送失败，请检查 GitHub Actions 日志。\\\"}\"}"
